spring.config.import=optional:file:.env[.properties]
spring.profiles.default=dev

server.port=${PORT:8080}
server.error.include-message=always

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pulsechat}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwtSecret=${JWT_SECRET:=======================pulsechat=local=development=secret========================}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
app.rateLimit.authPerMinute=${AUTH_RATE_LIMIT:10}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
